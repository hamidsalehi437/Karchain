/** Apply UIState.filters to the OPEN set (all matching is client-side). */
function filteredMarketJobs() {
  const f = UIState.filters;
  const q = f.q.trim().toLowerCase();
  let jobs = Jobs.openJobs().filter(j => {
    if (f.cat !== 'ALL' && j.category !== f.cat) return false;
    if (f.region !== 'ALL' && (j.region || regionFromLocation(j.location)) !== f.region) return false;
    const usd = Jobs.usdValue(j);
    if (f.pay === 'b1' && !(usd < 5)) return false;
    if (f.pay === 'b2' && !(usd >= 5 && usd <= 20)) return false;
    if (f.pay === 'b3' && !(usd > 20 && usd <= 50)) return false;
    if (f.pay === 'b4' && !(usd > 50)) return false;
    if (q) {
      const hay = `${j.title} ${j.description} ${j.location}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  if (f.sort === 'pay')      jobs = jobs.sort((a, b) => Jobs.usdValue(b) - Jobs.usdValue(a));
  else if (f.sort === 'deadline') jobs = jobs.sort((a, b) => (a.deadline || Infinity) - (b.deadline || Infinity));
  else                       jobs = jobs.sort((a, b) => b.createdAt - a.createdAt);
  return jobs;
}

/**
 * GTA-style ACTIVE MISSION card (Module 1). Prepended to the marketplace
 * list for every IN_PROGRESS / UNDER_REVIEW job of the signed-in worker:
 * live countdown, inline proof composer (digital tasks) or 4-digit
 * delivery passcode entry (physical tasks), dispute + review states.
 */
function missionCard(job) {
  const poster = userById(job.createdBy);
  const physical = job.category === 'LOCAL_PHYSICAL';
  const due = job.deadline || (job.acceptedAt + 24 * 3600 * 1000);   // 24h fallback clock
  const review = job.status === 'UNDER_REVIEW';
  const stripe = (CFG.CATEGORIES[job.category] || {}).stripe;
  return `
  <article class="kc-card p-4 md:p-5" style="border:1px solid rgba(16,185,129,.55);border-left:4px solid ${stripe || '#10b981'};box-shadow:0 0 24px rgba(16,185,129,.08)">
    <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
      <div class="flex flex-wrap items-center gap-2">
        <span class="kc-badge" data-tone="emerald">${icon('zap', 'w-3 h-3')} ${t('mission.active')}</span>
        ${statusBadge(job.status)}
        ${job.disputed ? `<span class="kc-badge" data-tone="rose">${icon('alert', 'w-3 h-3')} ${t('mission.disputed')}</span>` : ''}
        <span class="kc-mono text-xs text-zinc-600">${esc(job.ref)}</span>
      </div>
      <span class="kc-mono text-sm" data-countdown data-deadline="${due}" title="Time to deadline">⏳ —:—:—</span>
    </div>
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div class="min-w-0">
        <h3 class="text-lg font-bold">${esc(job.title)}</h3>
        <p class="text-xs text-zinc-500 mt-1">
          ${icon('user', 'w-3.5 h-3.5')} ${poster ? esc(poster.handle) : 'poster'} ·
          ${icon('map-pin', 'w-3.5 h-3.5')} ${esc(job.region || regionFromLocation(job.location))} ·
          ${icon('volume', 'w-3.5 h-3.5')}
          <button type="button" class="kc-linklike" data-action="speak" data-speak="${esc(job.title)} · reward ${fmtMoney(job.amount, job.currency)} ${job.currency}">listen</button>
        </p>
      </div>
      <div class="md:text-right">
        <div class="text-lg font-bold text-emerald-400">${fmtMoney(job.amount, job.currency)} <span class="text-xs font-medium text-zinc-500">${job.currency}</span></div>
        <div class="text-xs text-zinc-500">${fmtEq(job.amount, job.currency)} · escrow locked</div>
      </div>
    </div>
    ${review ? `
    <div class="mt-3 p-3 text-sm" style="border:1px dashed rgba(245,158,11,.5);border-radius:10px;color:#fbbf24">
      ${icon('clock', 'w-4 h-4')} <strong>${t('mission.awaiting')}</strong> — admin approval pending. Escrow stays locked until the review verdict.
    </div>` : job.disputed ? `
    <div class="mt-3 p-3 text-sm" style="border:1px dashed rgba(244,63,94,.5);border-radius:10px;color:#fb7185">
      ${icon('alert', 'w-4 h-4')} <strong>${t('mission.disputed')}</strong> — an admin rejected the last proof. Re-submit corrected proof below.
    </div>
    ${physical ? `
    <form data-form="f-passcode" data-id="${job.id}" novalidate class="mt-3 flex flex-wrap items-end gap-2 p-3" style="border:1px dashed rgba(56,189,248,.4);border-radius:10px">
      <div class="flex-1 min-w-40">
        <label class="kc-label" for="pc-${job.id}">${t('mission.passcode_ph')} ${icon('lock', 'w-3 h-3')}</label>
        <div class="flex gap-2">
          <input id="pc-${job.id}" name="code" class="kc-input kc-mono" inputmode="numeric" maxlength="4" placeholder="0000" style="width:7.5rem;letter-spacing:.35em;text-align:center">
          <button type="submit" class="kc-btn kc-btn-primary kc-btn-sm">${icon('check', 'w-3.5 h-3.5')} ${t('mission.verify')}</button>
        </div>
        <p class="kc-err" id="err-pc-${job.id}"></p>
        <p class="kc-hint">Enter the code the task poster shows you at handover — instant escrow release, no admin review.</p>
      </div>
    </form>` : `
    <form data-form="f-mission-proof" data-id="${job.id}" novalidate class="mt-3 p-3" style="border:1px dashed rgba(244,63,94,.4);border-radius:10px">
      <label class="kc-label" for="mp-${job.id}">${t('btn.submit_proof')} — corrected evidence</label>
      <div class="flex flex-wrap gap-2">
        <input id="mp-${job.id}" name="text" class="kc-input flex-1 min-w-40" maxlength="280" placeholder="Describe the correction or paste a new link…">
        <button type="submit" class="kc-btn kc-btn-primary kc-btn-sm">${icon('check', 'w-3.5 h-3.5')} ${t('btn.submit_proof')}</button>
      </div>
      <label class="kc-btn kc-btn-ghost kc-btn-sm mt-2 cursor-pointer" style="display:inline-flex">
        ${icon('copy', 'w-3.5 h-3.5')} ${t('market.proof_file')}
        <input type="file" accept="image/*" data-file="mp-photo" class="hidden" aria-label="${t('market.proof_file')}">
      </label>
      <p class="kc-hint" data-photo-hint></p>
      <p class="kc-err" id="err-mp-${job.id}"></p>
    </form>`}` : physical ? `
    <form data-form="f-passcode" data-id="${job.id}" novalidate class="mt-3 flex flex-wrap items-end gap-2 p-3" style="border:1px dashed rgba(56,189,248,.4);border-radius:10px">
      <div class="flex-1 min-w-40">
        <label class="kc-label" for="pc-${job.id}">${t('mission.passcode_ph')} ${icon('lock', 'w-3 h-3')}</label>
        <div class="flex gap-2">
          <input id="pc-${job.id}" name="code" class="kc-input kc-mono" inputmode="numeric" maxlength="4" placeholder="0000" style="width:7.5rem;letter-spacing:.35em;text-align:center">
          <button type="submit" class="kc-btn kc-btn-primary kc-btn-sm">${icon('check', 'w-3.5 h-3.5')} ${t('mission.verify')}</button>
        </div>
        <p class="kc-err" id="err-pc-${job.id}"></p>
        <p class="kc-hint">Enter the code the task poster shows you at handover — instant escrow release, no admin review.</p>
      </div>
    </form>` : `
    <form data-form="f-mission-proof" data-id="${job.id}" novalidate class="mt-3 p-3" style="border:1px dashed rgba(16,185,129,.4);border-radius:10px">
      <label class="kc-label" for="mp-${job.id}">${t('btn.submit_proof')} — link / notes</label>
      <div class="flex flex-wrap gap-2">
        <input id="mp-${job.id}" name="text" class="kc-input flex-1 min-w-40" maxlength="280" placeholder="e.g. https://drive.google.com/… or delivery notes">
        <button type="submit" class="kc-btn kc-btn-primary kc-btn-sm">${icon('check', 'w-3.5 h-3.5')} ${t('btn.submit_proof')}</button>
      </div>
      <label class="kc-btn kc-btn-ghost kc-btn-sm mt-2 cursor-pointer" style="display:inline-flex">
          ${icon('copy', 'w-3.5 h-3.5')} ${t('market.proof_file')}
          <input type="file" accept="image/*" data-file="mp-photo" class="hidden" aria-label="${t('market.proof_file')}">
        </label>
        <p class="kc-hint" data-photo-hint></p>
        <p class="kc-err" id="err-mp-${job.id}"></p>
    </form>`}
  </article>`;
}

/** Re-render ONLY the list portion (keeps filter inputs intact while typing).
    Active-mission cards for the signed-in worker ride on top of the list. */
function marketListRender() {
  const listEl = $('#market-list'); if (!listEl) return;
  const jobs = filteredMarketJobs();
  const user = me();
  const missions = user ? Jobs.forWorker(user.id)
    .filter(j => j.status === 'IN_PROGRESS' || j.status === 'UNDER_REVIEW') : [];
  const countEl = $('#market-count');
  if (countEl) countEl.textContent = `${jobs.length} task${jobs.length === 1 ? '' : 's'} · updated live`;
  const missionHtml = missions.length
    ? missionModeWrap(missions.map(missionCard).join(''))   // v6 · Mission Mode workspace
    : '';
  const jobsHtml = jobs.length
    ? jobs.map(jobRow).join('')
    : (missions.length ? '' : `<div class="kc-empty">
         <h4>No tasks match these filters</h4>
         <p>Try widening the payment range, clearing the category filter, or searching a different skill.</p>
         <button type="button" class="kc-btn kc-btn-ghost kc-btn-sm" data-action="clear-filters">${icon('refresh', 'w-3.5 h-3.5')} Clear filters</button>
       </div>`);
  listEl.innerHTML = missionHtml + jobsHtml;
}


/* -- 7.4 · MY TASKS (worker: assigned jobs across the lifecycle) -------- */

function viewMyTasks() {
  const user = me();
  const jobs = Jobs.forWorker(user.id).sort((a, b) => Jobs.lastTouch(b) - Jobs.lastTouch(a));
  const active = jobs.filter(j => j.status === 'IN_PROGRESS').length;
  const review = jobs.filter(j => j.status === 'UNDER_REVIEW').length;
  const done = jobs.filter(j => j.status === 'COMPLETED').length;
  const earned = Wallet.ledgerFor(user.id).filter(l => l.type === 'EARNING')
    .reduce((s, l) => s + toUsd(l.amount, l.currency), 0);

  return `
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
    ${statCard(t('stat.in_progress'), active, t('stat.in_progress_sub_w'))}
    ${statCard(t('stat.under_review'), review, t('stat.under_review_sub'))}
    ${statCard(t('stat.completed'), done, t('stat.completed_sub'))}
    ${statCard(t('stat.earned'), fmtUsd(earned), 'released from escrow')}
  </div>

  <div class="flex items-center justify-between mb-3">
    <h2 class="text-lg font-semibold">${t('head.my_accepted')}</h2>
    <button type="button" class="kc-btn kc-btn-ghost kc-btn-sm" data-action="set-tab" data-tab="market">${icon('search', 'w-3.5 h-3.5')} Browse marketplace</button>
  </div>

  ${jobs.length ? `
  <div class="kc-card kc-tablewrap">
    <table class="kc-table">
      <thead><tr>
        <th>Task</th><th>Value</th><th>Status</th><th>Updated</th><th class="text-right">Action</th>
      </tr></thead>
      <tbody>${jobs.map(workerJobRow).join('')}</tbody>
    </table>
  </div>` : `
  <div class="kc-empty">
    <h4>You haven't accepted any tasks yet</h4>
    <p>Head to the marketplace, pick something that matches your skills — physical errands nearby, data entry, translations or AI tagging — and accept it to lock the poster's escrow.</p>
    <button type="button" class="kc-btn kc-btn-primary kc-btn-sm" data-action="set-tab" data-tab="market">${icon('search', 'w-3.5 h-3.5')} Browse open tasks</button>
  </div>`}`;
}

/** Worker-side table row with lifecycle-aware action buttons. */
function workerJobRow(job) {
  const latestNote = job.reviewNotes.length ? job.reviewNotes[job.reviewNotes.length - 1] : null;
  const showNote = latestNote && job.status === 'IN_PROGRESS';

  let actions = '';
  if (job.status === 'IN_PROGRESS') {
    actions = `
      <button type="button" class="kc-btn kc-btn-ghost kc-btn-sm" data-action="abandon-job" data-id="${job.id}">Abandon</button>
      <button type="button" class="kc-btn kc-btn-primary kc-btn-sm" data-action="open-proof" data-id="${job.id}">${t('btn.submit_proof')}</button>`;
  } else if (job.status === 'UNDER_REVIEW') {
    actions = `<button type="button" class="kc-btn kc-btn-ghost kc-btn-sm" data-action="open-job" data-id="${job.id}">${icon('eye', 'w-3.5 h-3.5')} Awaiting review</button>`;
  } else {
    actions = `<button type="button" class="kc-btn kc-btn-ghost kc-btn-sm" data-action="open-job" data-id="${job.id}">Receipt</button>`;
  }

  return `
  <tr>
    <td class="min-w-0">
      <button type="button" class="text-left" data-action="open-job" data-id="${job.id}">
        <span class="font-semibold hover:underline">${esc(job.title)}</span>
      </button>
      <div class="flex items-center gap-2 mt-1">${categoryBadge(job.category)}<span class="kc-mono text-xs text-zinc-600">${esc(job.ref)}</span></div>
      ${job.disputed ? `<p class="text-xs text-rose-400 mt-1">${icon('alert', 'w-3 h-3')} ${t('mission.disputed')} — correct and re-submit proof</p>` : ''}
      ${(job.status === 'IN_PROGRESS' && job.passcode) ? `<p class="text-xs text-sky-400 mt-1">${icon('lock', 'w-3 h-3')} ${t('mission.passcode_hint')} — ask the poster for the 4-digit code at handover</p>` : ''}
      ${showNote ? `<p class="text-xs text-amber-400 mt-1 truncate" title="${esc(latestNote.note)}">Changes requested: ${esc(latestNote.note)}</p>` : ''}
    </td>
    <td class="whitespace-nowrap"><span class="font-semibold">${fmtMoney(job.amount, job.currency)}</span><div class="text-xs text-zinc-500">${job.currency}</div></td>
    <td>${statusBadge(job.status)}</td>
    <td class="whitespace-nowrap text-zinc-500">${timeAgo(Jobs.lastTouch(job))}</td>
    <td class="text-right"><div class="flex justify-end gap-2">${actions}</div></td>
  </tr>`;
}

/* -- 7.6 · MANAGE TASKS (poster: active job milestones) ------------------ */

function viewManage() {
  const user = me();
  const jobs = Jobs.forPoster(user.id).sort((a, b) => Jobs.lastTouch(b) - Jobs.lastTouch(a));
  const open = jobs.filter(j => j.status === 'OPEN').length;
  const active = jobs.filter(j => j.status === 'IN_PROGRESS').length;
  const review = jobs.filter(j => j.status === 'UNDER_REVIEW').length;
  const done = jobs.filter(j => j.status === 'COMPLETED').length;
  const escrowUsd = Wallet.escrowTotalUsd(user);

  return `
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
    ${statCard(t('stat.open_short'), open, 'awaiting a worker')}
    ${statCard(t('stat.in_progress'), active, t('stat.in_progress_sub_p'))}
    ${statCard(t('stat.under_review'), review, review ? t('stat.under_review_sub2') : 'nothing pending')}
    ${statCard(t('stat.completed'), done, t('stat.completed_sub'))}
  </div>

  ${escrowUsd > 0 ? `
  <div class="kc-card p-4 mb-5 flex flex-wrap items-center justify-between gap-3" style="border-color:rgba(56,189,248,.3)">
    <div class="flex items-center gap-3 text-sm">
      <span class="kc-badge" data-tone="sky">${icon('shield', 'w-3 h-3')} escrow</span>
      <span class="text-zinc-400">${fmtUsd(escrowUsd)} of your funds is currently locked for active tasks — it releases to workers when you approve their proof.</span>
    </div>
    <button type="button" class="kc-btn kc-btn-ghost kc-btn-sm" data-action="set-tab" data-tab="wallet">Open wallet</button>
  </div>` : ''}

  <div class="flex items-center justify-between mb-3">
    <h2 class="text-lg font-semibold">${t('head.my_posted')}</h2>
    <button type="button" class="kc-btn kc-btn-primary kc-btn-sm" data-action="set-tab" data-tab="post">${icon('plus', 'w-3.5 h-3.5')} ${t('btn.post_task')}</button>
  </div>

  ${jobs.length ? `
  <div class="kc-card kc-tablewrap">
    <table class="kc-table">
      <thead><tr>
        <th>Task</th><th>Worker</th><th>Value</th><th>Escrow</th><th>Status</th><th>Updated</th><th class="text-right">Action</th>
      </tr></thead>
      <tbody>${jobs.map(posterJobRow).join('')}</tbody>
    </table>
  </div>` : `
  <div class="kc-empty">
    <h4>You haven't posted any tasks yet</h4>
    <p>Describe an errand, a digital batch job or an IT visit, set the reward in USD, AFN or crypto, and it appears in the marketplace instantly.</p>
    <button type="button" class="kc-btn kc-btn-primary kc-btn-sm" data-action="set-tab" data-tab="post">${icon('plus', 'w-3.5 h-3.5')} Create your first task</button>
  </div>`}`;
}

/** Poster-side table row with milestone management actions. */
function posterJobRow(job) {
  const worker = job.assignedTo ? userById(job.assignedTo) : null;

  let actions = '';
  if (job.status === 'OPEN') {
    actions = `
      <button type="button" class="kc-btn kc-btn-ghost kc-btn-sm" data-action="open-job" data-id="${job.id}">Details</button>
      <button type="button" class="kc-btn kc-btn-danger kc-btn-sm" data-action="cancel-job" data-id="${job.id}">Cancel</button>`;
  } else if (job.status === 'IN_PROGRESS') {
    actions = `<button type="button" class="kc-btn kc-btn-ghost kc-btn-sm" data-action="open-job" data-id="${job.id}">${icon('clock', 'w-3.5 h-3.5')} In progress</button>`;

    actions = `<button type="button" class="kc-btn kc-btn-primary kc-btn-sm" data-action="open-review" data-id="${job.id}">${icon('eye', 'w-3.5 h-3.5')} ${t('btn.review_proof')}</button>`;
  } else {
    actions = `<button type="button" class="kc-btn kc-btn-ghost kc-btn-sm" data-action="open-job" data-id="${job.id}">Receipt</button>`;
  }

  return `
  <tr>
    <td class="min-w-0">
      <button type="button" class="text-left" data-action="open-job" data-id="${job.id}">

      <div class="flex items-center gap-2 mt-1">${categoryBadge(job.category)}<span class="kc-mono text-xs text-zinc-600">${esc(job.ref)}</span></div>
      ${(job.status === 'IN_PROGRESS' && job.passcode) ? `<span class="kc-badge" data-tone="sky" title="Share with the worker at handover — matching code auto-releases escrow">${icon('lock', 'w-3 h-3')} code <span class="kc-mono">${esc(job.passcode)}</span></span>` : ''}
    </td>
    <td class="whitespace-nowrap">${worker ? `${esc(worker.handle)} <div class="mt-1">${Trust.badge(worker)}</div>` : '<span class="text-zinc-600">—</span>'}</td>
    <td class="whitespace-nowrap"><span class="font-semibold">${fmtMoney(job.amount, job.currency)}</span><div class="text-xs text-zinc-500">${job.currency}</div></td>
    <td class="whitespace-nowrap">${job.escrowed ? `<span class="kc-badge" data-tone="sky">${icon('shield', 'w-3 h-3')} locked</span>` : '<span class="text-zinc-600">—</span>'}</td>
    <td>${job.status === 'UNDER_REVIEW' ? `<span class="kc-pulse">${statusBadge(job.status)}</span>` : statusBadge(job.status)}</td>
    <td class="whitespace-nowrap text-zinc-500">${timeAgo(Jobs.lastTouch(job))}</td>
    <td class="text-right"><div class="flex justify-end gap-2">${actions}</div></td>
  </tr>`;
}

/**
 * One bazaar product card — enterprise image frame + escrow-aware states
 * (v5). The buyer's pending card carries the private handoff passcode;
 * the seller's carries the verification input module.
 */
function bazaarCard(item) {
  const user = me();
  const seller = userById(item.sellerId);
  const cat = CFG.BAZAAR_CATEGORIES[item.category] || CFG.BAZAAR_CATEGORIES.OTHER;
  const status = item.status || (item.soldTo ? 'SOLD' : 'AVAILABLE');
  const sold = status === 'SOLD';
  const pending = status === 'PENDING_DELIVERY';
  const own = item.sellerId === user.id;
  const isBuyer = !!(item.tx && item.tx.buyerId === user.id);
  const bal = user.balances[item.currency] || 0;
  const short = status === 'AVAILABLE' && !own && bal < item.price;
  const dim = pending || sold;

  return `
  <article class="kc-card kc-card-hover overflow-hidden flex flex-col${sold ? ' opacity-70' : ''}" style="border-left:4px solid ${cat.stripe}">
    <div class="relative" style="height:11rem;background:rgba(2,6,23,.92);border-bottom:1px solid rgba(39,41,54,.9)">
      <img src="${esc(item.imageUrl || CFG.MARKET_PLACEHOLDER_IMG)}" alt="${esc(item.name)}" loading="lazy" referrerpolicy="no-referrer"
           class="w-full h-full object-cover"${dim ? ' style="filter:grayscale(.55) brightness(.7)"' : ''}>
      <div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(2,6,23,.55) 0%,rgba(2,6,23,0) 42%,rgba(2,6,23,.78) 100%)"></div>
      <span class="kc-badge absolute top-2 left-2" data-tone="${cat.tone}">${esc(cat.label)}</span>
      ${sold      ? `<span class="kc-badge absolute top-2 right-2" data-tone="zinc">${icon('check', 'w-3 h-3')} ${t('market.status_sold')}</span>`
        : pending ? `<span class="kc-badge absolute top-2 right-2" data-tone="amber">${icon('lock', 'w-3 h-3')} ${t('market.status_pending')}</span>`
        :           `<span class="kc-badge absolute top-2 right-2" data-tone="emerald">${icon('zap', 'w-3 h-3')} ${t('market.status_available')}</span>`}
      <div class="absolute bottom-2 left-3 right-3 flex items-end justify-between gap-2">
        <h3 class="text-sm font-bold leading-snug text-white" style="text-shadow:0 2px 6px rgba(2,6,23,.9)">${esc(item.name)}</h3>
        <div class="text-right shrink-0">
          <div class="text-base font-extrabold text-white" style="text-shadow:0 2px 6px rgba(2,6,23,.9)">${fmtMoney(item.price, item.currency)}</div>
          <div class="text-[11px] text-zinc-300">${esc(fmtEq(item.price, item.currency))}</div>
        </div>
      </div>
    </div>

    <div class="p-4 flex flex-col gap-3 flex-1">
      <p class="text-xs text-zinc-500">${icon('user', 'w-3 h-3')} ${seller ? esc(seller.handle) : 'unknown'} · ${icon('map-pin', 'w-3 h-3')} ${esc(item.region)} · ${icon('clock', 'w-3 h-3')} listed ${timeAgo(item.createdAt)}</p>
      <div class="flex flex-wrap items-center gap-2">
        <span class="kc-badge" data-tone="sky">${icon('list', 'w-3 h-3')} ${t('market.qty_chip')} ${Number(item.qty || 1)}</span>
        <button type="button" class="kc-linklike" data-action="speak" data-speak="${esc(item.name)} · ${fmtMoney(item.price, item.currency)} ${item.currency} · ${t('market.qty_chip')} ${Number(item.qty || 1)}">${icon('volume', 'w-3 h-3')} listen</button>
      </div>

      ${isBuyer && pending ? `
      <div class="p-3" style="border:1px dashed rgba(56,189,248,.45);border-radius:10px;background:rgba(56,189,248,.06)">
        <div class="text-xs font-semibold text-sky-300">${icon('lock', 'w-3.5 h-3.5')} ${t('market.your_code')}</div>
        <div class="kc-mono text-2xl font-bold text-center my-1 text-sky-300" style="letter-spacing:.5em">${esc(item.tx.passcode)}</div>
        <p class="kc-hint">${t('market.code_hint')}</p>
      </div>` : ''}

      ${own && pending ? `
      <form data-form="f-bazaar-release" data-id="${item.id}" novalidate class="p-3 flex flex-col gap-2" style="border:1px dashed rgba(245,158,11,.5);border-radius:10px;background:rgba(245,158,11,.06)">
        <label class="kc-label" for="bz-code-${item.id}">${t('market.enter_code')} ${icon('lock', 'w-3 h-3')}</label>
        <div class="flex gap-2">
          <input id="bz-code-${item.id}" name="code" class="kc-input kc-mono" inputmode="numeric" maxlength="4" placeholder="0000" style="width:7.5rem;letter-spacing:.35em;text-align:center">
          <button type="submit" class="kc-btn kc-btn-primary kc-btn-sm">${icon('check', 'w-3.5 h-3.5')} ${t('market.verify')}</button>
        </div>
        <p class="kc-err" id="err-bz-code-${item.id}"></p>
        <p class="kc-hint">${t('market.seller_hint')}</p>
      </form>` : ''}

      <div class="flex items-center justify-between gap-2 mt-auto">
        ${sold ? `<span class="text-xs text-zinc-500">${icon('check', 'w-3 h-3')} sold ${timeAgo(item.soldAt)}</span>`
          : pending ? `<span class="kc-badge" data-tone="amber">${icon('lock', 'w-3 h-3')} ${fmtMoney(item.tx.amount, item.tx.currency)} ${t('market.escrow_locked')}</span>`
          : own ? `<span class="kc-badge" data-tone="zinc">${icon('user', 'w-3 h-3')} your listing</span>`
          : `<span class="text-xs text-zinc-600">${icon('shield', 'w-3 h-3')} ${t('market.trade_note')}</span>`}

          ? (own ? `<span class="kc-badge" data-tone="emerald">${icon('zap', 'w-3 h-3')} live</span>`

          : (pending && !own && !isBuyer ? `<span class="text-xs text-zinc-500">${t('market.pending_other')}</span>` : '')}
      </div>
    </div>
  </article>`;
}


const VIEWS = {
  worker: viewWorker, company: viewCompany, bazaar: viewBazaar,
  wallet: viewWallet, profile: viewProfile,
};

/** Paint the whole app (auth screen or dashboard shell). */
function renderApp() {
  const root = $('#app-root');
  const user = me();
  if (!user) { root.innerHTML = viewAuth(); return; }

  /* Keep the active role/tab valid (v6: three-tab public portal model). */
  if (DB.session.role !== 'poster') DB.session.role = 'worker';
  if (!VIEWS[DB.session.tab]) DB.session.tab = DB.session.role === 'poster' ? 'company' : 'worker';

  root.innerHTML = shellWrap(VIEWS[DB.session.tab]());
  Sync.renderBadge();                                    // online/offline indicator state
  Web3.renderBadge();                                    // wallet connection state
  if (DB.session.tab === 'worker') marketListRender();   // fill the list + count + Mission Mode
  if (DB.session.tab === 'company') syncPostCurrencyHint();
  if (DB.session.tab === 'wallet' && Web3.connected) Web3.refreshKrc();   // live KRC paint
}


/* -- 7.12 · PROFILE SETTINGS (v4) ----------------------------------------
   User-driven account hub: identity + XP rank, trust-score breakdown,
   the referral (network-marketing) dashboard, KYC submission and
   password management. Nothing here touches other users' data.        */

function viewProfile() {
  const user = me();
  const level = levelOf(user.xp || 0);
  const rank = rankOf(level);
  const xpInto = (user.xp || 0) % CFG.XP_PER_LEVEL;
  const pct = Math.min(100, Math.round((xpInto / CFG.XP_PER_LEVEL) * 100));

/* ══════════════════════════ §8 · MODALS & TOASTS ═════════════════════ */

/** Open a modal. html = full modal markup (use modalShell for consistency). */
function openModal(html) {
  $('#modal-root').innerHTML = `
  <div class="kc-overlay" data-action="modal-backdrop">
    <div class="kc-modal" role="dialog" aria-modal="true">${html}</div>
  </div>`;
  document.body.classList.add('kc-modal-open');
  const first = $('#modal-root input, #modal-root select, #modal-root textarea');
  if (first) first.focus();
}

function closeModal() {
  $('#modal-root').innerHTML = '';
  document.body.classList.remove('kc-modal-open');
  UIState.confirmCb = null;
}

function modalShell(title, subtitle, body, foot) {
  return `
  <div class="kc-modal-head">
    <div class="min-w-0">
      <h3 class="text-lg font-semibold">${title}</h3>
      ${subtitle ? `<p class="text-sm text-zinc-500 mt-0.5">${subtitle}</p>` : ''}
    </div>
    <button type="button" class="kc-icon-btn" data-action="modal-close" aria-label="Close dialog">${icon('x', 'w-4 h-4')}</button>
  </div>
  <div class="kc-modal-body">${body}</div>
  ${foot ? `<div class="kc-modal-foot">${foot}</div>` : ''}`;
}

/** Non-blocking notification. message may contain safe inline HTML. */
function toast(message, type = 'info') {
  const root = $('#toast-root'); if (!root) return;
  const el = document.createElement('div');
  el.className = 'kc-toast';
  el.dataset.type = type;
  el.innerHTML = `${icon(type === 'success' ? 'check-circle' : type === 'error' ? 'alert' : 'zap', 'w-4 h-4')}<div class="flex-1">${message}</div>`;
  root.appendChild(el);
  setTimeout(() => { el.classList.add('kc-toast-out'); setTimeout(() => el.remove(), 260); }, 4200);
}

/** Generic confirmation dialog (destructive / careful actions). */
function confirmAction({ title, message, confirmLabel = 'Confirm', tone = 'primary', onConfirm }) {
  UIState.confirmCb = onConfirm;
  openModal(modalShell(title, '',
    `<p class="text-sm text-zinc-400">${message}</p>`,
    `<button type="button" class="kc-btn kc-btn-ghost" data-action="modal-close">Cancel</button>
     <button type="button" class="kc-btn kc-btn-${tone}" data-action="confirm-yes">${esc(confirmLabel)}</button>`));
}

/* -- 8.1 · TASK DETAILS (lifecycle stepper + contextual actions) -------- */

/** Horizontal 4-state milestone tracker. */
function stepper(job) {
  const order = ['OPEN', 'IN_PROGRESS', 'UNDER_REVIEW', 'COMPLETED'];
  const cur = order.indexOf(job.status);
  return `
  <div class="kc-stepper mb-5">
    ${order.map((s, i) => `
      ${i ? `<span class="kc-line" data-done="${i <= cur}"></span>` : ''}
      <span class="kc-step" data-state="${i < cur ? 'done' : i === cur ? 'current' : 'todo'}">
        <span class="kc-step-dot">${i < cur ? '✓' : i + 1}</span>
        <span class="kc-step-label">${esc(CFG.STATUSES[s].label)}</span>
      </span>`).join('')}
  </div>`;
}

/** Requirements as a milestone checklist (uses the latest proof's checks). */
function requirementsList(job) {
  const latest = job.proofHistory.length ? job.proofHistory[job.proofHistory.length - 1] : null;
  const showChecks = latest && (job.status === 'UNDER_REVIEW' || job.status === 'COMPLETED');
  return `
  <ul class="flex flex-col gap-2">
    ${job.requirements.map((r, i) => `
      <li class="flex items-start gap-2 text-sm">
        ${showChecks
          ? (latest.checks && latest.checks[i]
              ? `<span class="text-emerald-400 mt-0.5">${icon('check-circle', 'w-4 h-4')}</span>`
              : `<span class="text-zinc-600 mt-0.5">${icon('x', 'w-4 h-4')}</span>`)
          : `<span class="text-zinc-600 mt-0.5">${icon('check', 'w-4 h-4')}</span>`}
        <span class="text-zinc-300">${esc(r)}</span>
      </li>`).join('')}
  </ul>`;
}

function openJobModal(job) {
  const user = me();
  const own = job.createdBy === user.id;
  const assignedToMe = job.assignedTo === user.id;
  const worker = job.assignedTo ? userById(job.assignedTo) : null;
  const dl = deadlineInfo(job);

  /* Contextual footer — the same task offers different actions per role/state. */
  const levelLocked = (job.minLevel || 1) > levelOf(user.xp || 0);
  let foot = `<button type="button" class="kc-btn kc-btn-ghost" data-action="modal-close">Close</button>`;
  if (job.status === 'OPEN' && !own) {
    foot += levelLocked
      ? `<button type="button" class="kc-btn kc-btn-ghost" disabled title="Reach level ${job.minLevel || 1} to unlock this premium task">${icon('lock', 'w-4 h-4')} ${t('mission.locked')} · ${t('mission.level_lock')} ${job.minLevel || 1}</button>`
      : `<button type="button" class="kc-btn kc-btn-primary" data-action="accept-job" data-id="${job.id}">${t('btn.accept')} · ${fmtMoney(job.amount, job.currency)}</button>`;
  } else if (job.status === 'OPEN' && own) {
    foot = `<button type="button" class="kc-btn kc-btn-ghost" data-action="modal-close">Close</button>
            <button type="button" class="kc-btn kc-btn-danger" data-action="cancel-job" data-id="${job.id}">Cancel posting</button>`;
  } else if (assignedToMe && job.status === 'IN_PROGRESS') {
    foot = `<button type="button" class="kc-btn kc-btn-ghost" data-action="abandon-job" data-id="${job.id}">Abandon task</button>
            <button type="button" class="kc-btn kc-btn-primary" data-action="open-proof" data-id="${job.id}">Submit proof of completion</button>`;
  } else if (own && job.status === 'UNDER_REVIEW') {
    foot += `<button type="button" class="kc-btn kc-btn-primary" data-action="open-review" data-id="${job.id}">Review submitted proof</button>`;
  }

  const proofBlocks = job.proofHistory.length ? job.proofHistory.slice().reverse().map(p => `
    <div class="kc-card p-4 mb-3">
      <div class="flex items-center justify-between gap-2 mb-2">
        <span class="kc-badge" data-tone="sky">proof submitted</span>
        <span class="text-xs text-zinc-500">${timeAgo(p.at)}</span>
      </div>
      <p class="text-sm text-zinc-300 whitespace-pre-wrap">${esc(p.text)}</p>
      ${p.link ? `<a class="text-sm text-emerald-400 underline-offset-2 hover:underline inline-flex items-center gap-1 mt-2" href="${esc(p.link)}" target="_blank" rel="noopener noreferrer">${icon('link', 'w-3.5 h-3.5')} ${esc(p.link)}</a>` : ''}
    </div>`).join('') : '';

  const noteBlocks = job.reviewNotes.length ? job.reviewNotes.slice().reverse().map(n => `
    <div class="kc-card p-4 mb-3" style="border-color:rgba(251,191,36,.3)">
      <div class="flex items-center justify-between gap-2 mb-1">
        <span class="kc-badge" data-tone="amber">changes requested</span>
        <span class="text-xs text-zinc-500">${timeAgo(n.at)}</span>
      </div>
      <p class="text-sm text-zinc-300">${esc(n.note)}</p>
    </div>`).join('') : '';

  /* Poster-only delivery passcode panel — the worker must NEVER see this. */
  const passcodeBlock = (own && job.passcode && job.status === 'IN_PROGRESS') ? `
    <div class="kc-card p-4 mb-5" style="border-color:rgba(56,189,248,.4)">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <span class="kc-badge" data-tone="sky">${icon('lock', 'w-3 h-3')} delivery passcode</span>
          <p class="text-xs text-zinc-500 mt-2">Share this code with the worker at handover. A matching entry auto-completes the task and releases escrow instantly — no admin review.</p>
        </div>
        <div class="kc-mono text-3xl font-bold tracking-[.35em] text-sky-400">${esc(job.passcode)}</div>
      </div>
    </div>` : '';

  const disputeBlock = job.disputed ? `
    <div class="kc-card p-4 mb-5" style="border-color:rgba(244,63,94,.45)">
      <span class="kc-badge" data-tone="rose">${icon('alert', 'w-3 h-3')} ${t('mission.disputed')}</span>
      <p class="text-xs text-zinc-400 mt-2">An admin rejected the previous proof. The worker can re-submit corrected proof for another review round.</p>
    </div>` : '';

  openModal(modalShell(
    esc(job.title),
    `${esc(job.ref)} · ${esc(tCategory(job.category))} · reward ${fmtMoney(job.amount, job.currency)} ${job.currency} ${esc(fmtEq(job.amount, job.currency))}`,
    `
    <div class="flex items-start justify-between gap-2 mb-3">
      <span></span>
      <button type="button" class="kc-btn kc-btn-ghost kc-btn-sm" data-action="speak" data-speak="${esc(job.title)} · ${esc(job.description.slice(0, 220))}" title="Voice-over: read this task aloud">${icon('volume', 'w-4 h-4')} Listen</button>
    </div>
    ${stepper(job)}
    <dl class="kc-kv mb-5">
      <dt>Poster</dt><dd>${posterLine(job.createdBy)}</dd>
      <dt>Worker</dt><dd>${worker ? `${esc(worker.handle)}${worker.jobsDone ? ` <span class="text-zinc-600">· ✓${worker.jobsDone}</span>` : ''} ${Trust.badge(worker)}` : '<span class="text-zinc-500">not assigned yet</span>'}</dd>
      <dt>Escrow</dt><dd>${job.escrowed ? '<span class="text-sky-400">' + fmtMoney(job.amount, job.currency) + ' locked</span>' : job.status === 'COMPLETED' ? '<span class="text-emerald-400">released to worker</span>' : 'locks when a worker accepts'}</dd>
      <dt>${t('label.region')}</dt><dd>${esc(job.region || regionFromLocation(job.location))}</dd>
      ${job.location ? `<dt>Location</dt><dd>${esc(job.location)}</dd>` : ''}
      <dt>${t('label.min_level')}</dt><dd>Level ${job.minLevel || 1}+ · ${esc(rankOf(job.minLevel || 1))}</dd>
      ${job.deadline ? `<dt>Deadline</dt><dd class="${dl.tone === 'over' ? 'text-rose-400' : ''}">${fmtDate(job.deadline)} — ${esc(dl.label)}</dd>` : ''}
      <dt>Posted</dt><dd>${timeAgo(job.createdAt)}</dd>
      ${job.completedAt ? `<dt>Completed</dt><dd>${fmtDate(job.completedAt)} · ${job.autoVerified ? 'auto-verified via delivery passcode' : 'receipt in both ledgers'}</dd>` : ''}
    </dl>
    ${passcodeBlock}

    <h4 class="kc-stat-label mb-2">Description</h4>
    <p class="text-sm text-zinc-400 whitespace-pre-wrap mb-5">${esc(job.description)}</p>
    <h4 class="kc-stat-label mb-2">Completion requirements ${job.proofHistory.length ? '· latest submission' : ''}</h4>

    ${noteBlocks ? `<h4 class="kc-stat-label mt-5 mb-2">Poster feedback</h4>${noteBlocks}` : ''}

    foot));

/* ══════════════════════════ §9 · FORMS ═══════════════════════════════ */

/** Collect a form's fields as a trimmed { name: value } map. */
function formValues(form) {
  const out = {};
  for (const [k, v] of new FormData(form).entries()) out[k] = String(v).trim();
  return out;
}
/** Write an inline validation error (field id === error-slot prefix). */
function setErr(form, field, msg) {
  const slot = document.getElementById('err-' + field);
  if (slot) slot.textContent = msg || '';
  const input = document.getElementById(field);
  if (input) msg ? input.setAttribute('aria-invalid', 'true') : input.removeAttribute('aria-invalid');
}
function clearErrs(form) {
  $$('.kc-err', form).forEach(e => { e.textContent = ''; });
  $$('[aria-invalid]', form).forEach(i => i.removeAttribute('aria-invalid'));
}

const FORMS = {

  /* -- auth: username + password sign-in ------------------------------- */
  'f-signin': async (form) => {
    clearErrs(form);
    const v = formValues(form);
    if (!v.handle) return setErr(form, 'si-handle', 'Enter your handle.');
    if (!v.password) return setErr(form, 'si-password', 'Enter your password.');
    const res = await Auth.login(v.handle, v.password);
    if (!res.ok) return setErr(form, 'si-password', res.error);
    Auth.loginAs(res.user);
    renderApp();
    toast(`Welcome back, <b>${esc(res.user.handle)}</b>`, 'success');
  },

  /* -- auth: anonymous registration ------------------------------------ */
  'f-register': async (form) => {
    clearErrs(form);
    const v = formValues(form);
    if (!Auth.validHandle(Auth.normalizeHandle(v.handle))) return setErr(form, 'rg-handle', '3–20 characters — lowercase letters, numbers, underscore.');
    if ((v.password || '').length < 6) return setErr(form, 'rg-password', 'Use at least 6 characters.');
    const res = await Auth.register(v.handle, v.password);
    if (!res.ok) return setErr(form, 'rg-handle', res.error);
    Auth.loginAs(res.user);
    if (v.referral) {
      const r = Referrals.attach(res.user, v.referral);
      /* v6 · the dashboard has already replaced the register form, so the
         failure surfaces as a toast (the account itself stays valid). */
      if (!r.ok) { setErr(form, 'rg-referral', r.error); toast(r.error, 'error'); }
      else toast(`Referred by <b>@${esc(r.referrer.handle)}</b> — they earn 2% of every mission you clear.`, 'info');
    }
    renderApp();
    toast(`Account created — welcome, <b>${esc(res.user.handle)}</b>. ${fmtMoney(CFG.STARTER_CREDIT.USDT, 'USDT')} simulated starter credit added.`, 'success');
  },

  /* -- auth: wallet connect --------------------------------------------- */
  'f-wallet': (form) => {
    clearErrs(form);
    const v = formValues(form);
    const chain = CFG.CHAINS[v.chain] ? v.chain : 'ETH';
    if (!CFG.CHAINS[chain].pattern.test(v.address)) {
      return setErr(form, 'wl-address', `That doesn't look like a valid ${CFG.CHAINS[chain].label} address.`);
    }
    const res = Auth.connect(chain, v.address);
    Auth.loginAs(res.user);
    renderApp();
    toast(res.created
      ? `Wallet connected — new account <b>${esc(res.user.handle)}</b> created.`
      : `Wallet recognized — welcome back, <b>${esc(res.user.handle)}</b>.`, 'success');
  },

  /* -- poster: publish a new task ---------------------------------------- */
  'f-post-job': (form) => {
    clearErrs(form);
    const v = formValues(form);

    /* Validation — every field the marketplace relies on. */
    if ((v.title || '').length < 6) return setErr(form, 'pj-title', 'Give the task a descriptive title (6+ characters).');
    if (!CFG.CATEGORIES[v.category]) return setErr(form, 'pj-title', 'Pick a valid category.');
    const amount = parseFloat(v.amount);
    if (!isFinite(amount) || amount <= 0) return setErr(form, 'pj-amount', 'Set a reward greater than zero.');
    if (amount > 1000000) return setErr(form, 'pj-amount', 'Keep it under 1,000,000 per task.');
    if ((v.description || '').length < 20) return setErr(form, 'pj-desc', 'Describe the task in at least 20 characters — workers decide from this.');
    const reqs = (v.requirements || '').split('\n').map(s => s.trim()).filter(s => s.length >= 3);
    if (reqs.length < 1) return setErr(form, 'pj-reqs', 'Add at least one checkable completion requirement.');
    let deadline = null;
    if (v.deadline) {
      deadline = new Date(v.deadline + 'T23:59:59').getTime();
      if (isNaN(deadline) || deadline < Date.now()) return setErr(form, 'pj-deadline', 'The deadline must be in the future.');
    }

    const job = Jobs.create({
      title: v.title, description: v.description, category: v.category,
      currency: v.currency, amount: roundCur(amount, v.currency),
      requirements: reqs, location: v.location || '', deadline,
      region: CFG.REGIONS.includes(v.region) ? v.region : regionFromLocation(v.location || ''),
      minLevel: Math.min(4, Math.max(1, parseInt(v.minLevel, 10) || 1)),
    });

    refresh();
    toast(`Task <b>${esc(job.ref)}</b> published — it is live in the marketplace.`, 'success');
  },

  /* -- worker: submit proof of completion --------------------------------- */
  'f-proof': (form) => {
    clearErrs(form);
    const v = formValues(form);
    const job = Jobs.byId(v.jobId);

    if (!job || job.assignedTo !== user.id || job.status !== 'IN_PROGRESS') {
      closeModal();
      return toast('This task can no longer be submitted — it may have changed state.', 'error');

    if (v.link && !/^https?:\/\/.+\..+/.test(v.link)) return setErr(form, 'pf-link', 'Link must start with http:// or https://');
    const checks = $$('input[name="checks"]:checked', form).map(i => parseInt(i.value, 10));
    const checkFlags = job.requirements.map((_, i) => checks.includes(i));

    Jobs.submitProof(job, user, { text: v.text, link: v.link, checks: checkFlags });
    closeModal();
    refresh();
    SFX.submit();
    splash('MISSION SUBMITTED', `Awaiting admin approval for <b>${esc(job.ref)}</b> — escrow stays locked until the verdict.`, 'amber');

    Sync.track('proof.submit', { jobId: job.id, ref: job.ref });

    if (String(v.code).trim() !== job.passcode) {
      return setErr(form, `pc-${job.id}`, 'Code does not match — ask the poster to confirm the passcode.');
    }
    const split = Referrals.onMissionCleared(job);               // 2% referral split (§6C)

    if (!ok) {

    DB.kyc.submissions.unshift({
      id: uid(), userId: user.id, idType: v.idType, idNumber: v.idNumber.trim(),
      city: v.city, submittedAt: Date.now(), status: 'pending', reviewedAt: null, note: null,
    });
    Store.save();
    refresh();
    logEvent('kyc', `<b>${esc(user.handle)}</b> submitted a ${esc(v.idType)} for KYC verification`, 'sky');
    Sync.track('kyc.submit', { userId: user.id });
    toast('KYC submission sent — the admin desk will review it shortly.', 'success');
  },

  /* -- profile: attach a referrer (once) ----------------------------------- */
  'f-set-referrer': (form) => {
    clearErrs(form);
    const v = formValues(form);
    const r = Referrals.attach(me(), v.referral);
    if (!r.ok) return setErr(form, 'rf-handle', r.error);
    refresh();
    toast(`Referred by <b>@${esc(r.referrer.handle)}</b> — they earn 2% of every mission you clear.`, 'success');
    logEvent('referral', `<b>${esc(me().handle)}</b> attached referrer <b>@${esc(r.referrer.handle)}</b>`, 'violet');
  },

  /* -- profile: password change -------------------------------------------- */
  'f-password': async (form) => {
    clearErrs(form);
    const v = formValues(form);
    const user = me();
    if (!user.passHash) return;
    const oldOk = (await sha256(v.old || '')) === user.passHash;
    if (!oldOk) return setErr(form, 'pw-old', 'Current password is incorrect.');
    if ((v.next || '').length < 6) return setErr(form, 'pw-new', 'New password needs at least 6 characters.');
    user.passHash = await sha256(v.next);
    Store.save();
    form.reset();
    toast('Password updated — it takes effect on your next sign-in.', 'success');
    logEvent('system', `<b>${esc(user.handle)}</b> changed their password`, 'zinc');
  },

};

/* ══════════════════════════ §10 · EVENTS ═════════════════════════════ */
/*  One delegated router per event type. Every interactive element declares
   itself with data-action / data-form / data-filter / data-dyn — no inline
   handlers anywhere.                                                          */

/** Generate a plausible address for the selected chain (testing rail). */
function generateAddress(chain) {
  const hex = (n) => Array.from({ length: n }, () => '0123456789abcdef'[randInt(0, 15)]).join('');
  const b58 = (n) => {
    const A = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
    return Array.from({ length: n }, () => A[randInt(0, A.length - 1)]).join('');
  };
  if (chain === 'ETH')  return '0x' + hex(40);
  if (chain === 'TRON') return 'T' + b58(33);
  return 'bc1q' + Array.from({ length: 38 }, () => 'qpzry9x8gf2tvdw0s3jn54khce6mua7l'[randInt(0, 31)]).join('');
}

const ACTIONS = {

  'import-krc': () => { Web3.importOnchain(); },
  'set-tab':     (el) => {
    /* v6 · the worker/company tabs also switch the operating role. */
    if (el.dataset.tab === 'worker')  DB.session.role = 'worker';
    if (el.dataset.tab === 'company') DB.session.role = 'poster';
    DB.session.tab = el.dataset.tab; Store.save(); renderApp();

  'dismiss-announcement': (el) => {
    /* v6 · per-user dismissal — this member folds the card away; the
       announcement itself stays live for everyone else on the node.   */
    const user = me();
    const ann = (DB.admin.announcements || []).find(a => a.id === el.dataset.id);
    if (!ann || !user) return;
    if (!Array.isArray(ann.dismissedByUsers)) ann.dismissedByUsers = [];
    if (!ann.dismissedByUsers.includes(user.id)) ann.dismissedByUsers.push(user.id);
    Store.save();
    refresh();
  },
  'logout':      () => Auth.logout(),
  'reset-data':  () => confirmAction({
    title: 'Reset all local data?',
    message: 'Every account, task and transaction on this device is wiped and the demo dataset is rebuilt. This cannot be undone.',
    confirmLabel: 'Wipe & reset', tone: 'danger',
    onConfirm: () => Store.reset(),
  }),

  /* -- auth helpers ------------------------------------------------------ */
  'fill-demo': (el) => {
    UIState.authMode = 'signin';
    renderApp();
    $('#si-handle').value = el.dataset.handle;
    $('#si-password').value = 'demo1234';
    toast(`Demo credentials filled — press <b>Sign in</b>.`, 'info');
  },
  'guest-create': () => {
    const handle = 'guest_' + Math.random().toString(36).slice(2, 6);
    const user = {
      id: uid(), handle, passHash: null, wallet: { chain: 'TRON', address: generateAddress('TRON') },
      balances: { USD: 0, AFN: 0, USDT: 0, KRC: 0 }, escrow: { USD: 0, AFN: 0, USDT: 0, KRC: 0, Bazaar: [] },
      joinedAt: Date.now(), jobsDone: 0, jobsPosted: 0,
      xp: 0, referredBy: null, referralCode: genReferralCode(), trustAdjust: 0, kyc: null, isAdmin: false,
    };
    DB.users.push(user);
    for (const [cur, amt] of Object.entries(CFG.GUEST_CREDIT)) {
      if (amt > 0) Wallet.credit(user, cur, amt, 'BONUS', 'Simulated guest credit');
    }
    Auth.loginAs(user);
    renderApp();
    toast(`Guest account <b>${esc(handle)}</b> created with test funds — explore both dashboards.`, 'success');
  },
  'gen-address': () => {
    const input = $('#wl-address'); if (!input) return;
    input.value = generateAddress($('#wl-chain')?.value || 'ETH');
    toast('Simulated address generated.', 'info');
  },

  /* -- job lifecycle transitions (guards live here) ---------------------- */
  'accept-job': (el, { id }) => {
    const job = Jobs.byId(id); const user = me();
    if (!job) return;
    /* v6 · probation guard: members below 70 trust are locked out of
       premium (level-gated) tasks until their score recovers.          */
    if ((job.minLevel || 1) > 1 && Trust.of(user).score < 70) {
      toast(t('trust.probation'), 'error');
      SFX.error();
      return;
    }
    if (job.status !== 'OPEN') return toast('That task is no longer open.', 'error');
    if (job.createdBy === user.id) return toast('You cannot accept your own posting.', 'error');
    if ((job.minLevel || 1) > levelOf(user.xp || 0)) {
      return toast(`Premium task locked — reach <b>Level ${job.minLevel}</b> (${esc(rankOf(job.minLevel))}) to accept it.`, 'error');
    }
    const poster = userById(job.createdBy);
    if (!poster || (poster.balances[job.currency] || 0) < job.amount) {
      return toast('The poster cannot fund the escrow for this task right now — try again later.', 'error');
    }
    Jobs.accept(job, user);
    closeModal();
    refresh();
    SFX.click();
    splash('MISSION ACCEPTED', `<b>${esc(job.ref)}</b> · ${esc(job.title)} — ${fmtMoney(job.amount, job.currency)} locked in escrow. Complete it before the clock runs out.`, 'emerald');
    logEvent('mission', `<b>${esc(user.handle)}</b> accepted Mission <b>${esc(job.ref)}</b>`, 'emerald');
    Sync.track('mission.accept', { jobId: job.id, ref: job.ref });
    toast(`Task <b>${esc(job.ref)}</b> accepted — ${fmtMoney(job.amount, job.currency)} locked in escrow by the poster. Submit proof when it\u2019s done.`, 'success');
  },
  'speak': (el) => {
    speak(el.dataset.speak || '', el.dataset.speakKey);
  },
  'open-proof': (el, { id }) => {
    const job = Jobs.byId(id);
    const user = me();
    if (!job || job.assignedTo !== user.id || job.status !== 'IN_PROGRESS') return toast('Nothing to submit for this task.', 'error');
    openProofModal(job);
  },
  'abandon-job': (el, { id }) => {
    const job = Jobs.byId(id);
    const user = me();
    if (!job || job.assignedTo !== user.id || job.status !== 'IN_PROGRESS') return;
    confirmAction({
      title: 'Abandon this task?',
      message: `The poster's escrow of ${fmtMoney(job.amount, job.currency)} is refunded and the task returns to the open marketplace. Repeated abandonment hurts your reputation.`,
      confirmLabel: 'Abandon task', tone: 'danger',
      onConfirm: () => { Jobs.abandon(job); closeModal(); refresh(); toast(`Task ${esc(job.ref)} abandoned — escrow refunded to the poster.`, 'info'); },
    });
  },
  'cancel-job': (el, { id }) => {
    const job = Jobs.byId(id);
    if (!job || job.createdBy !== me().id || job.status !== 'OPEN') return toast('Only open, unassigned tasks can be cancelled.', 'error');
    confirmAction({
      title: 'Cancel this posting?',
      message: `“${esc(job.title)}” will be removed from the marketplace. No funds were ever escrowed for it.`,
      confirmLabel: 'Remove posting', tone: 'danger',
      onConfirm: () => { Jobs.remove(job); closeModal(); refresh(); toast(`Posting ${esc(job.ref)} removed from the marketplace.`, 'info'); },
    });
  },
  'open-review': (el, { id }) => {
    const job = Jobs.byId(id);
    if (!job || job.createdBy !== me().id || job.status !== 'UNDER_REVIEW') return toast('Nothing to review right now.', 'error');
    openReviewModal(job);
  },
  'approve-job': (el, { id }) => {
    const job = Jobs.byId(id);
    /* Poster review modal OR admin ops deck (Module 2: admins may release
       escrow on any mission from the command deck).                     */
    const mayApprove = job && job.status === 'UNDER_REVIEW' &&
      (job.createdBy === me().id || DB.session.role === 'admin');
    if (!mayApprove) return toast('Nothing to approve right now.', 'error');
    const worker = userById(job.assignedTo);
    const split = Referrals.onMissionCleared(job);               // 2% referral split (§6C)
    Jobs.approve(job, split);
    const xp = worker ? grantXP(worker.id, 100) : null;          // +100 XP per passed mission
    closeModal();
    refresh();
    SFX.success();
    splash('MISSION PASSED', `Escrow released: <b>${fmtMoney(job.amount, job.currency)}</b> to <b>${esc(worker ? worker.handle : 'worker')}</b>${xp ? ` · +100 XP${xp.leveledUp ? ` — <b>LEVEL UP → L${xp.after} ${esc(rankOf(xp.after))}</b>` : ''}` : ''}`, 'emerald');
    logEvent('mission', `Admin approved Mission <b>${esc(job.ref)}</b> — escrow released to <b>${esc(worker ? worker.handle : 'worker')}</b>`, 'emerald');
    Sync.track('mission.approve', { jobId: job.id, ref: job.ref });
    toast(`Approved — ${fmtMoney(job.amount, job.currency)} released from escrow to <b>${esc(worker ? worker.handle : 'worker')}</b>.`, 'success');
  },
  'buy-item': (el, { id }) => {
    const item = (DB.market.items || []).find(i => i.id === id);
    const user = me();
    if (!item) return;
    if (item.status === 'PENDING_DELIVERY') return toast('That listing is locked for another buyer — a delivery is already in progress.', 'error');
    if (item.status !== 'AVAILABLE') return toast('That item was just sold — refresh your view of the bazaar.', 'error');
    if (item.sellerId === user.id) return toast('You cannot buy your own listing.', 'error');
    /* Live balance check in the LISTED currency (KRC included). */
    if ((user.balances[item.currency] || 0) < item.price) {
      return toast(`Insufficient ${item.currency} balance — top up your micro-wallet first.`, 'error');
    }
    const seller = userById(item.sellerId);
    /* v5 · escrow-backed B2B purchase — debit the buyer into their
       escrow.Bazaar pool. The merchant is NEVER paid directly; funds
       release only on the 4-digit passcode handshake (or admin override). */
    Market.lock(user, item);
    Store.save();
    refresh();
    SFX.click();
    splash(t('market.splash_locked'),
      `<b>${esc(item.name)}</b> — ${fmtMoney(item.price, item.currency)} ${item.currency} locked in bazaar escrow. Show your 4-digit handoff code to the merchant at dropoff to release the trade.`,
      'sky');
    logEvent('bazaar', `<b>${esc(user.handle)}</b> locked ${fmtMoney(item.price, item.currency)} ${item.currency} in bazaar escrow for <b>${esc(item.name)}</b>${seller ? ` from <b>${esc(seller.handle)}</b>` : ''}`, 'sky');
    Sync.track('bazaar.buy', { itemId: item.id, name: item.name, price: item.price, currency: item.currency });
    toast(`Escrow locked — show your handoff code to <b>${esc(seller ? seller.handle : 'the merchant')}</b> at dropoff.`, 'success');

  'splash-dismiss': () => {
    const root = $('#splash-root');
    if (root) root.innerHTML = '';
  },
  'request-changes': (el, { id }) => {
    const job = Jobs.byId(id);
    if (!job || job.createdBy !== me().id || job.status !== 'UNDER_REVIEW') return toast('Nothing to review right now.', 'error');
    const note = $('#rv-note') ? $('#rv-note').value.trim() : '';
    if (note.length < 5) return setErr(null, 'rv-note', 'Tell the worker what to change (5+ characters).');
    Jobs.requestChanges(job, note);
    closeModal();
    refresh();
    toast(`Changes requested on <b>${esc(job.ref)}</b> — the task is back In Progress.`, 'info');
  },
  'open-job': (el, { id }) => { const job = Jobs.byId(id); if (job) openJobModal(job); },

  /* -- wallet -------------------------------------------------------------- */
  'open-deposit': () => openDepositModal(),
  'open-payout':  () => openPayoutModal(),
  'copy-text':    (el) => copyText(el.dataset.copy),

  /* -- legacy v5 banner (engine parity — #banner-root no longer rendered) - */

  /* -- modal plumbing ------------------------------------------------------ */
  'modal-close':   () => closeModal(),
  'modal-backdrop': () => {},   // handled specially in the click router
  'confirm-yes':   () => { const cb = UIState.confirmCb; closeModal(); if (cb) cb(); },

  /* -- marketplace ---------------------------------------------------------- */
  'clear-filters': () => {
    UIState.filters = { q: '', cat: 'ALL', pay: 'ALL', region: 'ALL', sort: 'new' };
    renderApp();
    marketListRender();
  },
};

/* Click router — delegation with special-case for backdrop self-closing. */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  if (el.dataset.action === 'modal-backdrop' && e.target !== el) return; // clicked inside the panel
  const fn = ACTIONS[el.dataset.action];
  if (fn) fn(el, el.dataset, e);
});

/* Submit router — every form routes through the FORMS registry. */
document.addEventListener('submit', (e) => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  const fn = FORMS[form.dataset.form];
  if (fn) fn(form);
}, false);

/* Escape closes the topmost modal. */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('#modal-root .kc-overlay')) closeModal();
});

/* Broken product images (bad URL, offline, hotlink block) fall back to
   the built-in placeholder so every bazaar frame always renders. The
   error event does not bubble — hence the capture phase.            */
document.addEventListener('error', (e) => {
  const img = e.target;
  if (img && img.tagName === 'IMG' && img.dataset.kcFallback !== '1') {
    img.dataset.kcFallback = '1';
    img.src = CFG.MARKET_FALLBACK_IMG;
  }
}, true);

/* Marketplace filters — re-render the list only (inputs keep focus).
   The admin config editor reuses this channel for its live char counter. */
document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-filter]');
  if (el) {
    UIState.filters[el.dataset.filter] = el.value;
    marketListRender();
    return;
  }
});
document.addEventListener('change', (e) => {
  const f = e.target.closest('[data-filter]');
  if (f) { UIState.filters[f.dataset.filter] = f.value; marketListRender(); return; }
  const dyn = e.target.closest('[data-dyn]');
  if (!dyn) return;
  if (dyn.dataset.dyn === 'payout-method') syncPayoutMethodUI();
  if (dyn.dataset.dyn === 'pj-currency')   syncPostCurrencyHint();
  if (dyn.dataset.dyn === 'locale')        setLocale(dyn.value || 'en');
  if (dyn.id === 'po-amount' || dyn.id === 'po-currency') syncPayoutMethodUI();
  return;
});

/* v6 · Low-bandwidth photo pipeline: file inputs tagged data-file="bz-photo"
   (bazaar listing) or data-file="mp-photo" (mission proof) run through the
   canvas compressor and land as <60 KB data: URLs — no upload ever leaves
   the device. Non-image picks resolve to null and the field is untouched. */
document.addEventListener('change', async (e) => {
  const picker = e.target.closest('[data-file]');
  if (!picker) return;
  const form = picker.closest('form');
  const hint = form ? form.querySelector('[data-photo-hint]') : null;
  const file = (picker.files && picker.files[0]) || null;
  if (hint) hint.textContent = file ? 'Compressing…' : '';
  const dataUrl = await Images.compress(file);
  if (!dataUrl) {
    if (hint) hint.textContent = '';
    if (file) toast('That file is not a supported image — paste a URL instead.', 'info');
    return;
  }
  if (picker.dataset.file === 'bz-photo') {
    const input = document.getElementById('bz-image');
    if (input) input.value = dataUrl;
    if (hint) hint.textContent = `${t('market.photo_done')} (${Math.round(dataUrl.length * 0.75 / 1024)} KB)`;
  } else if (picker.dataset.file === 'mp-photo' && form) {
    form.dataset.photo = dataUrl;
    if (hint) hint.textContent = `${t('market.photo_done')} (${Math.round(dataUrl.length * 0.75 / 1024)} KB)`;
  }
});


/* ══════════════════════════ §11 · BOOTSTRAP ══════════════════════════ */

async function init() {
  await Store.load();

  /* Settlement ticker — advances simulated hawala payouts over time. */
  setInterval(() => {
    if (!DB) return;
    if (Wallet.advancePayouts()) {
      Store.save();
      if (DB.session.tab === 'wallet') renderApp();   // only repaint when visible
    }
  }, 3000);

  /* v3 platform services (§6A): RTL direction, sync badge + outbox
     warm-start, mission countdown ticker. */
  applyLocaleDir();
  Sync.init();
  startMissionTicker();
  Web3.init();          // v4 · silent wallet reconnect + live KRC balance

  renderApp();

  if (Store.memoryOnly) toast('localStorage is unavailable — the app works, but state will not survive a refresh.', 'error');
  if (document.documentElement.classList.contains('kc-nocdn')) {
    toast('Tailwind CDN unreachable — running on the built-in offline theme (fully functional).', 'info');
  }
}

/* Cross-tab sync: another tab writing the DB reloads state here. */
window.addEventListener('storage', (e) => {
  if (e.key === CFG.DB_KEY) Store.load().then(renderApp);
});

document.addEventListener('DOMContentLoaded', () => { init(); });
</script>

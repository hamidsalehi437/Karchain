/* ══════════════════════════ §8 · MODALS & TOASTS ═════════════════════ */

/** Open a modal. html = full modal markup (use modalShell for consistency). */
function openModal(html) {
  $('#modal-root').innerHTML = `
  <div class="kc-overlay" data-action="modal-backdrop">
    <div class="kc-modal" role="dialog" aria-modal="true">${html}</div>
  </div>`;
  document.body.classList.add('kc-modal-open');
  const first = $('#modal-root input, #modal-root select, #modal-root textarea');
  if (first) first.focus();
}

function closeModal() {
  $('#modal-root').innerHTML = '';
  document.body.classList.remove('kc-modal-open');
  UIState.confirmCb = null;
}

function modalShell(title, subtitle, body, foot) {
  return `
  <div class="kc-modal-head">
    <div class="min-w-0">
      <h3 class="text-lg font-semibold">${title}</h3>
      ${subtitle ? `<p class="text-sm text-zinc-500 mt-0.5">${subtitle}</p>` : ''}
    </div>
    <button type="button" class="kc-icon-btn" data-action="modal-close" aria-label="Close dialog">${icon('x', 'w-4 h-4')}</button>
  </div>
  <div class="kc-modal-body">${body}</div>
  ${foot ? `<div class="kc-modal-foot">${foot}</div>` : ''}`;
}

/** Non-blocking notification. message may contain safe inline HTML. */
function toast(message, type = 'info') {
  const root = $('#toast-root'); if (!root) return;
  const el = document.createElement('div');
  el.className = 'kc-toast';
  el.dataset.type = type;
  el.innerHTML = `${icon(type === 'success' ? 'check-circle' : type === 'error' ? 'alert' : 'zap', 'w-4 h-4')}<div class="flex-1">${message}</div>`;
  root.appendChild(el);
  setTimeout(() => { el.classList.add('kc-toast-out'); setTimeout(() => el.remove(), 260); }, 4200);
}

/** Generic confirmation dialog (destructive / careful actions). */
function confirmAction({ title, message, confirmLabel = 'Confirm', tone = 'primary', onConfirm }) {
  UIState.confirmCb = onConfirm;
  openModal(modalShell(title, '',
    `<p class="text-sm text-zinc-400">${message}</p>`,
    `<button type="button" class="kc-btn kc-btn-ghost" data-action="modal-close">Cancel</button>
     <button type="button" class="kc-btn kc-btn-${tone}" data-action="confirm-yes">${esc(confirmLabel)}</button>`));
}

/* -- 8.1 · TASK DETAILS (lifecycle stepper + contextual actions) -------- */

/** Horizontal 4-state milestone tracker. */
function stepper(job) {
  const order = ['OPEN', 'IN_PROGRESS', 'UNDER_REVIEW', 'COMPLETED'];
  const cur = order.indexOf(job.status);
  return `
  <div class="kc-stepper mb-5">
    ${order.map((s, i) => `
      ${i ? `<span class="kc-line" data-done="${i <= cur}"></span>` : ''}
      <span class="kc-step" data-state="${i < cur ? 'done' : i === cur ? 'current' : 'todo'}">
        <span class="kc-step-dot">${i < cur ? '✓' : i + 1}</span>
        <span class="kc-step-label">${esc(CFG.STATUSES[s].label)}</span>
      </span>`).join('')}
  </div>`;
}

/** Requirements as a milestone checklist (uses the latest proof's checks). */
function requirementsList(job) {
  const latest = job.proofHistory.length ? job.proofHistory[job.proofHistory.length - 1] : null;
  const showChecks = latest && (job.status === 'UNDER_REVIEW' || job.status === 'COMPLETED');
  return `
  <ul class="flex flex-col gap-2">
    ${job.requirements.map((r, i) => `
      <li class="flex items-start gap-2 text-sm">
        ${showChecks
          ? (latest.checks && latest.checks[i]
              ? `<span class="text-emerald-400 mt-0.5">${icon('check-circle', 'w-4 h-4')}</span>`
              : `<span class="text-zinc-600 mt-0.5">${icon('x', 'w-4 h-4')}</span>`)
          : `<span class="text-zinc-600 mt-0.5">${icon('check', 'w-4 h-4')}</span>`}
        <span class="text-zinc-300">${esc(r)}</span>
      </li>`).join('')}
  </ul>`;
}

/** Collect a form's fields as a trimmed { name: value } map. */
function formValues(form) {
  const out = {};
  for (const [k, v] of new FormData(form).entries()) out[k] = String(v).trim();
  return out;
}
/** Write an inline validation error (field id === error-slot prefix). */
function setErr(form, field, msg) {
  const slot = document.getElementById('err-' + field);
  if (slot) slot.textContent = msg || '';
  const input = document.getElementById(field);
  if (input) msg ? input.setAttribute('aria-invalid', 'true') : input.removeAttribute('aria-invalid');
}
function clearErrs(form) {
  $$('.kc-err', form).forEach(e => { e.textContent = ''; });
  $$('[aria-invalid]', form).forEach(i => i.removeAttribute('aria-invalid'));
}

const FORMS = {
  /* -- console: operator sign-in ------------------------------------------- */
  'f-admin-login': async (form) => {
    clearErrs(form);
    const v = formValues(form);
    if (!v.handle) return setErr(form, 'al-handle', 'Enter the operator handle.');
    if (!v.password) return setErr(form, 'al-password', 'Enter the password.');
    const res = await Auth.login(v.handle, v.password);
    if (!res.ok) return setErr(form, 'al-password', res.error);
    if (!res.user.isAdmin) return setErr(form, 'al-handle', 'This account is not an operator — the console requires isAdmin.');
    adminLoginAs(res.user);
    renderApp();
    logEvent('system', `Operator <b>${esc(res.user.handle)}</b> signed in to the admin console`, 'violet');
    toast(`Console unlocked — welcome, <b>${esc(res.user.handle)}</b>.`, 'success');
  },

  /* -- admin: save the global system configuration ------------------------
     Persists the document, bumps the version, publishes the global banner
     and flashes the save button — all without a full re-render so the
     editor keeps its DOM state (cursor, scroll, flash).                   */
  'f-admin-config': (form) => {
    clearErrs(form);
    const text = formValues(form).content || '';
    if (text.trim().length < 10) return setErr(form, 'ad-config-text', 'Write at least 10 characters before saving.');

    const c = DB.admin.config;
    c.content = text;
    c.version += 1;
    c.updatedAt = Date.now();
    c.updatedBy = me().handle;

    /* Publish the announcement banner shown at the top of every view. */
    DB.admin.banner = { message: 'System configuration updated successfully by Admin', ts: Date.now(), dismissed: false };

    Store.save();
    renderBanner();        // banner appears instantly
    updateAdminMeta();     // metadata card refreshes in place
    flashSaveButton();     // green flash on the save button
    toast(`System configuration saved — <b>v${c.version}</b> published to the network banner.`, 'success');
  },

  /* -- admin: support chat composer -----------------------------------------
     Appends the admin message instantly, clears the input, then a simulated
     automated acknowledgment arrives from the worker after 1.5 s.          */
  'f-admin-chat': () => {
    const input = $('#ad-chat-input');
    const ticket = activeTicket();
    if (!ticket) return;
    const text = ((input && input.value) || '').trim();
    if (!text) { toast('Type a message first — the reply box is empty.', 'info'); if (input) input.focus(); return; }

    const thread = DB.admin.chat.threads[ticket.id] || (DB.admin.chat.threads[ticket.id] = []);
    thread.push({ id: uid(), from: 'admin', text, at: Date.now() });   // instant append
    ticket.lastActivity = Date.now();
    ticket.unread = 0;

    scheduleWorkerAck(ticket.id);   // simulated live-server acknowledgment
    Store.save();
    refresh();                      // re-render → message visible, input cleared
    const fresh = $('#ad-chat-input');
    if (fresh) fresh.focus();
    scrollChatBottom();
  },















};

    const t = DB.admin.chat.tickets.find(x => x.id === id);
    if (!t) return;
    t.status = t.status === 'resolved' ? 'open' : 'resolved';
    t.lastActivity = Date.now();
    Store.save();
    refresh();
    toast(t.status === 'resolved' ? `Ticket <b>${esc(t.ref)}</b> marked resolved.` : `Ticket <b>${esc(t.ref)}</b> reopened.`, t.status === 'resolved' ? 'success' : 'info');
  },
  'admin-reset-config': () => confirmAction({
    title: 'Reset system configuration?',
    message: 'The editor reverts to the factory platform defaults and a new version is written. Custom edits currently in the textarea are discarded.',
    confirmLabel: 'Reset to defaults', tone: 'danger',
    onConfirm: () => {
      const c = DB.admin.config;
      c.content = ADMIN_DEFAULT_CONFIG;
      c.version += 1;
      c.updatedAt = Date.now();
      c.updatedBy = me().handle;
      Store.save();
      refresh();
      toast('Configuration reset to platform defaults.', 'info');
    },
  }),
  'admin-copy-config': () => copyText(($('#ad-config-text') && $('#ad-config-text').value) || DB.admin.config.content, 'Configuration copied to clipboard'),


  /* -- navigation & session -------------------------------------------- */
  'auth-mode':   (el) => { UIState.authMode = el.dataset.mode; renderApp(); },
  'reset-data':  () => confirmAction({
    title: 'Reset all local data?',
    message: 'Every account, task and transaction on this device is wiped and the demo dataset is rebuilt. This cannot be undone.',
    confirmLabel: 'Wipe & reset', tone: 'danger',
    onConfirm: () => Store.reset(),
  }),

  /* -- auth helpers ------------------------------------------------------ */

  'open-review': (el, { id }) => {
    const job = Jobs.byId(id);
    if (!job || job.status !== 'UNDER_REVIEW' || (job.createdBy !== me().id && !DB.admin.console.userId)) return toast('Nothing to review right now.', 'error');
    openReviewModal(job);
  },
  'approve-job': (el, { id }) => {
    const job = Jobs.byId(id);
    /* Poster review modal OR admin ops deck (Module 2: admins may release
       escrow on any mission from the command deck).                     */
    const mayApprove = job && job.status === 'UNDER_REVIEW' &&
      (job.createdBy === me().id || !!DB.admin.console.userId);   // console operator
    if (!mayApprove) return toast('Nothing to approve right now.', 'error');
    const worker = userById(job.assignedTo);
    const split = Referrals.onMissionCleared(job);               // 2% referral split (§6C)
    Jobs.approve(job, split);
    const xp = worker ? grantXP(worker.id, 100) : null;          // +100 XP per passed mission
    closeModal();
    refresh();
    SFX.success();
    splash('MISSION PASSED', `Escrow released: <b>${fmtMoney(job.amount, job.currency)}</b> to <b>${esc(worker ? worker.handle : 'worker')}</b>${xp ? ` · +100 XP${xp.leveledUp ? ` — <b>LEVEL UP → L${xp.after} ${esc(rankOf(xp.after))}</b>` : ''}` : ''}`, 'emerald');
    logEvent('mission', `Admin approved Mission <b>${esc(job.ref)}</b> — escrow released to <b>${esc(worker ? worker.handle : 'worker')}</b>`, 'emerald');
    Sync.track('mission.approve', { jobId: job.id, ref: job.ref });
    toast(`Approved — ${fmtMoney(job.amount, job.currency)} released from escrow to <b>${esc(worker ? worker.handle : 'worker')}</b>.`, 'success');
  },
  'splash-dismiss': () => {
    const root = $('#splash-root');
    if (root) root.innerHTML = '';
  },
  'request-changes': (el, { id }) => {
    const job = Jobs.byId(id);
    if (!job || job.createdBy !== me().id || job.status !== 'UNDER_REVIEW') return toast('Nothing to review right now.', 'error');
    const note = $('#rv-note') ? $('#rv-note').value.trim() : '';
    if (note.length < 5) return setErr(null, 'rv-note', 'Tell the worker what to change (5+ characters).');
    Jobs.requestChanges(job, note);
    closeModal();
    refresh();
    toast(`Changes requested on <b>${esc(job.ref)}</b> — the task is back In Progress.`, 'info');
  },
  'open-job': (el, { id }) => { const job = Jobs.byId(id); if (job) openJobModal(job); },

  'copy-text':    (el) => copyText(el.dataset.copy),

  /* -- admin panel ---------------------------------------------------------- */
  'dismiss-banner': () => {
    DB.admin.banner.dismissed = true;
    Store.save();
    renderBanner();
  },

  /* -- modal plumbing ------------------------------------------------------ */
  'modal-close':   () => closeModal(),
  'modal-backdrop': () => {},   // handled specially in the click router
  'confirm-yes':   () => { const cb = UIState.confirmCb; closeModal(); if (cb) cb(); },

};

/* Click router — delegation with special-case for backdrop self-closing. */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  if (el.dataset.action === 'modal-backdrop' && e.target !== el) return; // clicked inside the panel
  const fn = ACTIONS[el.dataset.action];
  if (fn) fn(el, el.dataset, e);
});

/* Submit router — every form routes through the FORMS registry. */
document.addEventListener('submit', (e) => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  const fn = FORMS[form.dataset.form];
  if (fn) fn(form);
}, false);

/* Escape closes the topmost modal. */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('#modal-root .kc-overlay')) closeModal();
});

/* Broken product images (bad URL, offline, hotlink block) fall back to
   the built-in placeholder so every bazaar frame always renders. The
   error event does not bubble — hence the capture phase.            */
document.addEventListener('error', (e) => {
  const img = e.target;
  if (img && img.tagName === 'IMG' && img.dataset.kcFallback !== '1') {
    img.dataset.kcFallback = '1';
    img.src = CFG.MARKET_FALLBACK_IMG;
  }
}, true);

/* Marketplace filters — re-render the list only (inputs keep focus).
   The admin config editor reuses this channel for its live char counter. */
document.addEventListener('input', (e) => {
  if (e.target.id === 'ad-config-text') updateAdminMetaCounts();   // admin editor counter
});
document.addEventListener('change', (e) => {
  const dyn = e.target.closest('[data-dyn]');
  if (!dyn) return;
  if (dyn.dataset.dyn === 'admin-user-q') { UIState.adminUserQuery = dyn.value; renderApp(); return; }   // users & trust search
});


/* ══════════════════════════ §11 · BOOTSTRAP ══════════════════════════ */

async function init() {
  await Store.load();

  /* Settlement ticker — advances simulated hawala payouts over time. */
  setInterval(() => {
    if (!DB) return;
    if (Wallet.advancePayouts()) {
      Store.save();
      if (DB.session.tab === 'wallet') renderApp();   // only repaint when visible
    }
  }, 3000);

  /* v3 platform services (§6A): RTL direction, sync badge + outbox
     warm-start, mission countdown ticker. */
  applyLocaleDir();
  Sync.init();
  startMissionTicker();
  Web3.init();          // v4 · silent wallet reconnect + live KRC balance

  renderApp();

  if (Store.memoryOnly) toast('localStorage is unavailable — the app works, but state will not survive a refresh.', 'error');
  if (document.documentElement.classList.contains('kc-nocdn')) {
    toast('Tailwind CDN unreachable — running on the built-in offline theme (fully functional).', 'info');
  }
}

/* Cross-tab sync: another tab writing the DB reloads state here. */
window.addEventListener('storage', (e) => {
  if (e.key === CFG.DB_KEY) Store.load().then(renderApp);
});

document.addEventListener('DOMContentLoaded', () => { init(); });
</script>
</body>
